# Local development infrastructure for SP Builders.
# Usage: docker compose up -d   (then copy .env.example → .env)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: spb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spb
      POSTGRES_PASSWORD: spb
      POSTGRES_DB: spbuilders
    ports:
      - '5432:5432'
    volumes:
      - spb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spb -d spbuilders']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spb-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - spb-redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: spb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - spb-miniodata:/data

volumes:
  spb-pgdata:
  spb-redisdata:
  spb-miniodata:
