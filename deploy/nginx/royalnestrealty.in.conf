# ============================================================================
#  HOST nginx site for RoyalNest — INTERNAL-proxy mode.
#
#  This lives on the VPS host nginx (NOT in a container), alongside the other
#  sites already on this box (klpandeymusic.com, pushpanjali, sparsh3d). The
#  host nginx is the edge: it owns :80/:443 and terminates TLS, then reverse-
#  proxies to the RoyalNest Caddy proxy on 127.0.0.1:8090, which host-routes
#  between the website and the admin container.
#
#      nginx :443 ──► 127.0.0.1:8090 (caddy) ──┬─► website:3000
#                                              └─► admin:3005
#
#  Port note: 8088/8443 are already taken by the musicalarchive proxy on this
#  server. RoyalNest uses 8090/8453 (PROXY_HTTP_PORT in .env.production).
#
#  INSTALL (once, on the VPS — deploy.sh → 4 does all of this for you):
#    sudo cp deploy/nginx/royalnestrealty.in.conf \
#            /etc/nginx/sites-available/royalnestrealty.in
#    sudo apt install -y apache2-utils
#    sudo htpasswd -c /etc/nginx/.htpasswd-royalnest royalnest
#    sudo ln -s /etc/nginx/sites-available/royalnestrealty.in /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d royalnestrealty.in -d www.royalnestrealty.in \
#                         -d admin.royalnestrealty.in
#
#  certbot rewrites both server blocks to listen on 443 with the right
#  ssl_certificate paths and adds the :80 → :443 redirect. Do not hand-edit
#  TLS in here; let certbot own it so renewals keep working.
#
#  If certbot's HTTP-01 challenge fails, check that all three A records already
#  resolve to this server and that port 80 is open (ufw allow 'Nginx Full').
#  No CDN or proxy may sit in front of the box during issuance.
# ============================================================================

# ── Public website ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name royalnestrealty.in www.royalnestrealty.in;

    # Uploaded images and PDFs are posted as data URIs inside the publish JSON,
    # so a publish body is multiple megabytes. nginx's 1 MB default would 413.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Caddy routes on this
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # tells the app it is https
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ── Admin console ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.royalnestrealty.in;

    client_max_body_size 25M;

    # The admin's own sign-in is a client-side mock — the credentials ship
    # inside the JS bundle. Basic Auth is what actually keeps strangers out,
    # by stopping the bundle being fetched at all.
    auth_basic "RoyalNest Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-royalnest;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # Caddy routes on this
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
